# 바깥에 열리는 유일한 포트. / = 포털, /git/ = Gitea, /llm/ = LiteLLM
# 템플릿: entrypoint 가 __LITELLM_MASTER_KEY__ 를 채워 /dev/shm/kit/nginx.conf(메모리)로 쓴다 (root 전용)
worker_processes 2;
pid /run/nginx.pid;
error_log /data/logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
  access_log /data/logs/nginx-access.log;
  # LLM 호출 기록 (누가 · 언제 · 크기 · 결과) — 포털 모니터링이 읽는다
  log_format kit_llm escape=json '{"ts":$msec,"user":"$kit_user","ip":"$remote_addr","path":"$uri","status":$status,"req_bytes":$request_length,"resp_bytes":$bytes_sent,"sec":$request_time}';
  client_max_body_size 200m;
  # 기기 인증서(P6): KIT_DEVICE_CERT=required 이면 사람이 여는 화면(포털·Git 웹·로그인)은 회사가 발급한 기기 인증서가 있어야 열린다.
  # 토큰으로 따로 인증하는 길(mcp-test 의 /llm·/api/devkit, 설치 파일, 임직원 PC 의 승인 저장소·git 마켓플레이스)은 뺀다.
  map "$kit_mtls_mode:$ssl_client_verify" $kit_mtls_block { default 0; "~^required:(?!SUCCESS$)" 1; }
  map $http_user_agent $kit_git_client { default 0; "~^git/" 1; }
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  server {
    include /run/kit-nginx-listen.conf;
    # 접근제어 (IP·CIDR 허용목록 — 포털 주관리자가 바꾼다)
    include /run/kit-nginx-access.conf;
    include /run/kit-nginx-mtls.conf;   # set $kit_mtls_mode off|required (+ ssl_client_certificate·ssl_crl)
    proxy_set_header X-Real-IP $remote_addr;
    location /git/ {
      set $kit_gate "$kit_mtls_block$kit_git_client";
      if ($kit_gate = "10") { return 403 "기기 인증서가 필요합니다 (회사가 발급한 기기 인증서를 이 PC 에 설치하세요)\n"; }
      proxy_pass http://127.0.0.1:3000/;
    }
    # Git 자격 증명 관리자(윈도우 GCM)는 Gitea 를 알아보고 서버 최상위 /login/oauth/ 로 브라우저 로그인을 한다
    location /login/oauth/ {
      if ($kit_mtls_block) { return 403 "기기 인증서가 필요합니다\n"; }
      proxy_pass http://127.0.0.1:3000/login/oauth/;
    }
    # 개발자는 개인 키로 부르고, LiteLLM 마스터 키는 여기서만 붙는다
    location /llm/ {
      auth_request /_auth/llm;
      auth_request_set $kit_user $upstream_http_x_kit_user;
      proxy_set_header Authorization "Bearer __LITELLM_MASTER_KEY__";
      proxy_set_header X-Kit-User $kit_user;
      access_log /data/logs/llm-access.jsonl kit_llm;
      proxy_pass http://127.0.0.1:4000/;
      proxy_buffering off; proxy_read_timeout 600s;
    }
    location = /_auth/llm {
      internal;
      proxy_pass http://127.0.0.1:8081/_auth/llm;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location ~ ^/(api/devkit/|download/|approved/) { proxy_pass http://127.0.0.1:8081; }   # 토큰·코드로 따로 인증
    # 배포 묶음 올리기(주관리자) — 1GB 넘는 묶음
    location = /api/versions/upload {
      if ($kit_mtls_block) { return 403 "기기 인증서가 필요합니다\n"; }
      client_max_body_size 4g; proxy_request_buffering off; proxy_read_timeout 900s;
      proxy_pass http://127.0.0.1:8081;
    }
    location / {
      if ($kit_mtls_block) { return 403 "기기 인증서가 필요합니다 (회사가 발급한 기기 인증서를 이 PC 에 설치하세요)\n"; }
      proxy_pass http://127.0.0.1:8081;
    }
  }
}
