# 바깥에 열리는 유일한 포트. / = 포털, /git/ = Gitea, /llm/ = LiteLLM
# 템플릿: entrypoint 가 __LITELLM_MASTER_KEY__ 를 채워 /run/kit-nginx.conf 로 쓴다 (root 전용)
worker_processes 2;
pid /run/nginx.pid;
error_log /data/logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
  access_log /data/logs/nginx-access.log;
  client_max_body_size 200m;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  server {
    include /run/kit-nginx-listen.conf;
    location /git/ { proxy_pass http://127.0.0.1:3000/; }
    # 개발자는 개인 키로 부르고, LiteLLM 마스터 키는 여기서만 붙는다
    location /llm/ {
      auth_request /_auth/llm;
      auth_request_set $kit_user $upstream_http_x_kit_user;
      proxy_set_header Authorization "Bearer __LITELLM_MASTER_KEY__";
      proxy_set_header X-Kit-User $kit_user;
      proxy_pass http://127.0.0.1:4000/;
      proxy_buffering off; proxy_read_timeout 600s;
    }
    location = /_auth/llm {
      internal;
      proxy_pass http://127.0.0.1:8081/_auth/llm;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location / { proxy_pass http://127.0.0.1:8081; }
  }
}
