<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감시자 — MCP Dev Kit</title>
<link rel="stylesheet" href="/static/kit.css">
<style>select,input.w { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px }
.pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef2f7 }
.s-배포 { background:#e3f5e9 } .s-탈락,.s-회수 { background:#fde8e8 } .s-검사,.s-승인 { background:#fff4e0 }</style>
</head>
<body>
<header class="top"><span class="brand">MCP Dev Kit</span><nav class="nav" id="nav" data-on="/admin/watchers"></nav></header>
<section class="hero"><span class="tag">감시자</span><h1 id="title">…</h1><p>필수 = 막는 항목이 있으면 승인할 수 없음 · 심화 = 결과만 보여 주고 막지 않음</p></section>
<main>
  <section class="card">
    <p class="kicker">검사에 쓰는 감시자</p><h2>목록</h2>
    <div class="scroll"><table><thead><tr><th>감시자</th><th>종류</th><th>수준</th><th>Docker 이미지 · 인자</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <form class="inline" id="add"><input class="w" id="nid" placeholder="id (예: semgrep)"> <input class="w" id="nname" placeholder="이름"> <input class="w" id="nimg" placeholder="사내 이미지 (예: registry.corp/semgrep:1.90)"> <button class="btn line">추가</button></form>
    <p class="dim">추가 감시자는 네트워크 없이 MCP 소스를 /src 에 읽기 전용으로 받아, 표준 출력에 {"findings":[{"severity","title","explain","file","line","fix"}]} 를 냅니다.</p>
    <p><button class="btn" id="save">저장</button> <span class="dim" id="saved"></span></p>
    <div class="err" id="err"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = ts => ts ? new Date((typeof ts === "number" ? ts * 1000 : ts)).toLocaleString("ko-KR", {hour12: false}) : "";
async function api(path, opt) { const r = await fetch(path, opt); const b = await r.json().catch(() => ({})); if (!r.ok) throw new Error(b.detail || r.statusText); return b; }
const put = (path, body) => api(path, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
let W;
function paint() {
  $("title").textContent = `감시자 ${W.watchers.length}개 · 필수 ${W.watchers.filter(w => w.level === "필수").length}`;
  const sel = (i, v) => `<select data-lv="${i}">${W.levels.map(l => `<option${l === v ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  $("rows").innerHTML = W.watchers.map((w, i) => `<tr><td><b>${esc(w.name || w.id)}</b><br><span class="dim mono">${esc(w.id)}</span></td>
    <td>${w.fixed ? "기본 (끌 수 없음)" : "추가"}</td><td>${sel(i, w.level)}</td>
    <td>${w.fixed ? "" : `<input class="w mono" data-img="${i}" value="${esc(w.image)}"> <input class="w mono" data-args="${i}" value="${esc((w.args || []).join(" "))}" placeholder="인자">`}</td>
    <td>${w.fixed ? "" : `<button class="btn line sm" data-del="${i}">삭제</button>`}</td></tr>`).join("");
  $("saved").textContent = W.by ? `v${W.version} · 마지막 변경 ${esc(W.by)} · ${when(W.at)}` : `v${W.version}`;
}
$("rows").onchange = ev => { const t = ev.target;
  if (t.dataset.lv) W.watchers[+t.dataset.lv].level = t.value;
  if (t.dataset.img) W.watchers[+t.dataset.img].image = t.value.trim();
  if (t.dataset.args) W.watchers[+t.dataset.args].args = t.value.trim().split(/\s+/).filter(Boolean); };
$("rows").onclick = ev => { const b = ev.target.closest("[data-del]"); if (b) { W.watchers.splice(+b.dataset.del, 1); paint(); } };
$("add").onsubmit = ev => { ev.preventDefault(); W.watchers.push({id: $("nid").value.trim(), name: $("nname").value.trim(), kind: "image", level: "심화", image: $("nimg").value.trim(), args: []}); ["nid", "nname", "nimg"].forEach(i => $(i).value = ""); paint(); };
$("save").onclick = async () => { $("err").textContent = ""; try { W = await put("/api/watchers", {watchers: W.watchers, expected_version: W.version}); paint(); $("saved").textContent += " — 저장했습니다. 다음 검사부터 적용"; } catch (e) { $("err").textContent = e.message; } };
api("/api/watchers").then(w => { W = w; paint(); }).catch(e => $("err").textContent = e.message);
</script>
<script src="/static/nav.js"></script>
</body>
</html>
