<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 개발 — MCP Dev Kit</title>
<link rel="stylesheet" href="/static/kit.css">
<style>
ol.steps { margin: 0; padding-left: 20px } ol.steps li { margin: 6px 0 }
pre { margin: 6px 0 0; padding: 12px 14px; border-radius: 8px; background: #0f1720; color: #e6edf3; font: 12px/1.6 ui-monospace, Consolas, monospace; letter-spacing: 0; white-space: pre-wrap; word-break: break-all }
input[name=name] { flex: 1 1 200px } input[name=description] { flex: 3 1 280px }
</style>
</head>
<body>
<header class="top"><span class="brand">MCP Dev Kit</span><nav class="nav" id="nav" data-on="/new"></nav></header>

<section class="hero">
  <span class="tag">신규 개발</span>
  <h1>새 MCP 만들기</h1>
  <p>저장소와 시작 코드를 만들어 드립니다</p>
</section>

<main>
  <section class="card">
    <p class="kicker">1</p>
    <h2>신청</h2>
    <form class="inline" id="f">
      <input name="name" placeholder="이름 (예: weekly-report)" required pattern="[a-z][a-z0-9-]{1,38}">
      <input name="description" placeholder="무엇을 하는 MCP 인가요">
      <button class="btn">만들기</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <section class="card" id="next" hidden>
    <p class="kicker">2</p>
    <h2>다음 순서</h2>
    <ol class="steps">
      <li><a href="/download">다운로드</a>에서 개인 키를 받고 goose(<span class="mono">mcp-test</span>)를 설치합니다.</li>
      <li>코드를 받습니다.<pre id="clone"></pre></li>
      <li>내 PC 에서 시험합니다.<pre id="try"></pre></li>
      <li>올립니다 — <span class="mono">git push</span> 하거나 <a href="/mcp">MCP 등록</a>에서 zip 으로 올리고 [검사 요청].</li>
    </ol>
  </section>

  <section class="card">
    <p class="kicker">내 저장소</p>
    <h2>진행 중</h2>
    <div class="scroll"><table><thead><tr><th>저장소</th><th></th></tr></thead><tbody id="repos"></tbody></table></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path, opt) {
  const r = await fetch(path, opt); const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.detail || r.statusText); return b;
}
async function repos() {
  const rs = await api("/api/repos");
  $("repos").innerHTML = rs.map(r => `<tr><td class="mono"><a href="/git/${esc(r.full_name)}">${esc(r.full_name)}</a></td>
    <td class="nw"><a class="btn line sm" href="/mcp">검사 요청</a></td></tr>`).join("") || '<tr><td colspan="2" class="dim">없음</td></tr>';
}
$("f").onsubmit = async ev => {
  ev.preventDefault(); $("err").textContent = "";
  const f = new FormData(ev.target);
  try {
    const r = await api("/api/projects", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: f.get("name"), description: f.get("description")})});
    const name = r.repo.split("/")[1];
    $("clone").textContent = `git clone ${r.clone}\ncd ${name}`;
    $("try").textContent = `pip install -e .\nmcp-test run --with-extension "${name}-mcp" -t "hello 툴로 kim 에게 인사해 줘"`;
    $("next").hidden = false; ev.target.reset(); repos();
  } catch (e) { $("err").textContent = e.message; }
};
repos();
</script>
<script src="/static/nav.js"></script>
</body>
</html>
