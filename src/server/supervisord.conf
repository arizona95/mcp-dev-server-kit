[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/run/supervisord.pid

; root: 허용목록 적용(nft·squid)만 맡는다
[program:egress-agent]
command=/opt/kit/venv/bin/python /opt/kit/server/egress-proxy/egress.py serve
environment=KIT_DATA="/data"
autorestart=true
stdout_logfile=/data/logs/egress-agent.log
redirect_stderr=true

; root: 키 저장소(Gitea 시크릿)를 푸는 일만 맡는다 — 포털·LiteLLM 은 유닉스 소켓으로 묻는다
[program:kit-secrets]
command=/opt/kit/venv/bin/python /opt/kit/server/kit-secrets/agent.py serve
priority=10
autorestart=true
stdout_logfile=/data/logs/kit-secrets.log
redirect_stderr=true

; squid 는 root 로 시작해 proxy 사용자로 내려간다. 바깥 연결이 허용된 유일한 사용자.
[program:squid]
command=/usr/sbin/squid -N -f /opt/kit/server/egress-proxy/squid.conf
autorestart=true
stdout_logfile=/data/logs/squid.log
redirect_stderr=true

[program:portal]
command=/opt/kit/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8081 --proxy-headers --app-dir /opt/kit/server/portal
user=kit
environment=KIT_DATA="/data",HOME="/home/kit",HTTPS_PROXY="http://127.0.0.1:3128",HTTP_PROXY="http://127.0.0.1:3128",NO_PROXY="127.0.0.1,localhost"
autorestart=true
stdout_logfile=/data/logs/portal.log
redirect_stderr=true

[program:litellm]
command=/opt/kit/server/litellm/run.sh
user=kit
environment=KIT_DATA="/data",HOME="/home/kit",HTTPS_PROXY="http://127.0.0.1:3128",HTTP_PROXY="http://127.0.0.1:3128",NO_PROXY="127.0.0.1,localhost"
autorestart=true
stdout_logfile=/data/logs/litellm.log
redirect_stderr=true

[program:gitea]
command=/opt/kit/bin/gitea web --work-path /data/gitea --config /data/gitea/custom/conf/app.ini
user=git
environment=HOME="/home/git",USER="git",GITEA_WORK_DIR="/data/gitea",HTTPS_PROXY="http://127.0.0.1:3128",HTTP_PROXY="http://127.0.0.1:3128",NO_PROXY="127.0.0.1,localhost"
autorestart=true
stdout_logfile=/data/logs/gitea.log
redirect_stderr=true

; 한 번만: 관리자 계정·포털 OAuth2 앱
[program:gitea-bootstrap]
command=/opt/kit/venv/bin/python /opt/kit/server/git-host/bootstrap.py
user=git
environment=HOME="/home/git",USER="git",KIT_DATA="/data"
autorestart=false
startsecs=0
stdout_logfile=/data/logs/gitea-bootstrap.log
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c /dev/shm/kit/nginx.conf -g "daemon off;"
autorestart=true
stdout_logfile=/data/logs/nginx.log
redirect_stderr=true

; root: docker.sock 으로 검사용 격리 컨테이너를 띄운다. 바깥(osv.dev)은 프록시로만.
[program:gate-worker]
command=/opt/kit/venv/bin/python /opt/kit/server/gate-worker/worker.py
directory=/opt/kit/server/gate-worker
environment=KIT_DATA="/data",HTTPS_PROXY="http://127.0.0.1:3128",HTTP_PROXY="http://127.0.0.1:3128",NO_PROXY="127.0.0.1,localhost"
autorestart=true
stdout_logfile=/data/logs/gate-worker.log
redirect_stderr=true
