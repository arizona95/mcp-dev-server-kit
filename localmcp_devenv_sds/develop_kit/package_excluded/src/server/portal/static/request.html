<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검사 결과 — MCP Dev Kit</title>
<link rel="stylesheet" href="/static/kit.css">
<style>
.v-통과 { background: var(--ok-bg); color: var(--ok) } .v-차단, .v-오류 { background: var(--no-bg); color: var(--no) }
.v-검토 { background: #fff4e5; color: #b54708 }
.s-critical, .s-high { background: var(--no-bg); color: var(--no) } .s-medium { background: #fff4e5; color: #b54708 }
.s-low, .s-info { background: var(--soft); color: var(--sub2) }
.hero .chip { font-size: 14px; padding: 4px 14px }
.warn { border-left: 4px solid var(--no); background: var(--no-bg); padding: 12px 16px; border-radius: 8px; margin-bottom: 8px }
.warn b { color: var(--no) }
.f { border-top: 1px solid var(--line); padding: 18px 0 }
.f:first-of-type { border-top: 0 }
.f h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.f .meta { color: var(--sub2); font-size: 12px; margin-bottom: 8px }
.f .label { font-size: 12px; font-weight: 700; color: var(--sub); margin: 12px 0 4px }
.f .explain { white-space: pre-wrap; color: var(--ink2) }
.code { margin: 0; border-radius: 8px; background: #0f1720; color: #c9d1d9; font: 12px/1.6 ui-monospace, Consolas, monospace; letter-spacing: 0; overflow-x: auto; padding: 8px 0 }
.code div { padding: 0 14px; white-space: pre } .code div.hit { background: rgba(255, 92, 92, .22); color: #fff }
.code .n { display: inline-block; width: 3.2em; color: #6e7681; user-select: none }
.diff div.add { background: rgba(46, 160, 67, .25); color: #fff } .diff div.del { background: rgba(248, 81, 73, .25); color: #fff }
.advice { background: var(--soft); border-radius: 8px; padding: 10px 14px; white-space: pre-wrap }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px }
.filters button { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer }
.filters button.on { background: #dbe9ff; border-color: #dbe9ff; color: var(--blue-dk); font-weight: 700 }
textarea { width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px }
.btn.red { background: var(--no) }
</style>
</head>
<body>
<header class="top"><span class="brand">MCP Dev Kit</span><nav class="nav" id="nav" data-on="/mcp"></nav></header>

<section class="hero">
  <span class="tag" id="tag">검사 결과</span>
  <h1 id="title">…</h1>
  <p id="sub"></p>
  <p style="margin-top:12px" id="verdict"></p>
</section>

<main>
  <section class="card" id="admin-card" hidden>
    <p class="kicker">관리자</p>
    <h2>승인 전 확인</h2>
    <div id="warns"></div>
    <div id="decision"></div>
  </section>

  <section class="card">
    <p class="kicker">걸린 항목</p>
    <h2 id="f-count">검사 항목</h2>
    <div class="filters" id="filters"></div>
    <div id="findings"></div>
  </section>

  <section class="card">
    <p class="kicker">툴</p>
    <h2>tools/list (격리 실행)</h2>
    <div class="scroll"><table>
      <thead><tr><th>툴</th><th>설명</th><th>표시</th></tr></thead>
      <tbody id="tools"></tbody>
    </table></div>
  </section>

  <section class="card">
    <p class="kicker">격리 실행</p>
    <h2>바깥 접속 시도</h2>
    <div class="scroll"><table>
      <thead><tr><th>단계</th><th>결과</th><th>대상</th></tr></thead>
      <tbody id="egress"></tbody>
    </table></div>
  </section>

  <section class="card">
    <p class="kicker">진행</p>
    <h2>검사 단계</h2>
    <div class="scroll"><table>
      <thead><tr><th>단계</th><th>결과</th><th>시간</th></tr></thead>
      <tbody id="steps"></tbody>
    </table></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = ts => new Date(ts * 1000).toLocaleString("ko-KR", {hour12: false});
const RID = location.pathname.split("/").pop();
const CHECK = {skillspector: "SkillSpector", osv: "의존성 (osv.dev)", sandbox: "격리 실행"};
const AP = {pending: "소명 검토 대기", accepted: "오탐 허용", rejected: "소명 거절"};
const DEC = {pending: "결정 대기", approved: "승인됨", rejected: "반려됨"};
let REQ, FILTER = "all";

async function api(path, opt) {
  const r = await fetch(path, opt); const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.detail || r.statusText); return b;
}

function codeBlock(lines) {
  if (!lines.length) return "";
  return `<pre class="code">${lines.map(l => `<div class="${l.hit ? "hit" : ""}"><span class="n">${l.n}</span>${esc(l.text)}</div>`).join("")}</pre>`;
}

function patchBlock(p) {
  if (!p || p.kind === "none" || !p.text) return '<div class="advice dim">이 규칙의 원본에 수정 제안이 없습니다. 설명을 보고 직접 고쳐 주세요.</div>';
  if (p.kind === "diff") return `<pre class="code diff">${p.text.trimEnd().split("\n").map(l =>
    `<div class="${l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : ""}">${esc(l)}</div>`).join("")}</pre>`;
  return `<div class="advice">${esc(p.text)}</div>`;
}

function appealBlock(f) {
  const a = f.appeal, me = window.KIT_ME || {}, open = REQ.decision === "pending";
  let h = '<div class="label">오탐 소명</div>';
  if (a) {
    h += `<div class="advice"><span class="chip ${a.status === "accepted" ? "ok" : a.status === "rejected" ? "no" : "gray"}">${AP[a.status]}</span> ${esc(a.text)}
      <div class="dim">${esc(a.by)} · ${when(a.at)}${a.decided_by ? ` → ${esc(a.decided_by)} · ${when(a.decided_at)}${a.note ? " — " + esc(a.note) : ""}` : ""}</div></div>`;
    if (me.is_admin && a.status === "pending" && open)
      h += `<p><input id="an${f.id}" placeholder="메모 (거절이면 사유 필수)" style="width:60%"> <button class="btn sm" data-ad="${f.id}" data-ok="1">허용</button> <button class="btn red sm" data-ad="${f.id}" data-ok="0">거절</button></p>`;
  } else if (me.login === REQ.submitter && open) {
    h += `<p><input id="ap${f.id}" placeholder="왜 오탐인지 (예: requires-python 은 패키지가 아니라 pyproject 설정 키입니다)" style="width:70%"> <button class="btn line sm" data-ap="${f.id}">소명 신청</button></p>`;
  } else h += '<div class="dim">없음</div>';
  return h;
}

function renderFindings() {
  const fs = (REQ.result?.findings || []).filter(f => FILTER === "all" || f.check === FILTER);
  $("findings").innerHTML = fs.map(f => `<div class="f" id="f${f.id}">
    <h3><span class="chip s-${esc(f.severity)}">${esc(f.severity)}</span>${esc(f.title)}<span class="chip gray">${esc(CHECK[f.check] || f.check)}</span></h3>
    <div class="meta">${[f.rule, f.cwe, f.file && (f.file + (f.line ? ":" + f.line : ""))].filter(Boolean).map(esc).join(" · ")}</div>
    <div class="label">왜 걸렸나</div><div class="explain">${esc(f.explain) || '<span class="dim">설명 없음</span>'}</div>
    ${f.snippet?.length ? `<div class="label">코드</div>${codeBlock(f.snippet)}` : ""}
    <div class="label">패치 제안</div>${patchBlock(f.patch)}
    ${appealBlock(f)}
  </div>`).join("") || '<p class="dim">걸린 항목이 없습니다.</p>';
}

function render() {
  const r = REQ, res = r.result || {};
  $("tag").textContent = `${r.repo}@${r.ref}` + (res.commit ? ` · ${res.commit.slice(0, 10)}` : "");
  $("title").textContent = r.name;
  $("sub").textContent = `${r.submitter} · ${when(r.created)} · ${DEC[r.decision]}` + (r.reason ? ` — ${r.reason}` : "");
  const v = r.status === "done" ? (res.effective_verdict || res.verdict) : (r.status === "running" ? "검사 중" : "대기");
  const acc = (res.findings || []).filter(f => f.appeal?.status === "accepted").length;
  $("verdict").innerHTML = `<span class="chip v-${esc(v)}">${esc(v)}</span>` + (acc ? ` <span class="dim">검사 결과 '${esc(res.verdict)}' · 오탐 허용 ${acc}건 반영</span>` : "") + (res.error ? ` <span class="dim">${esc(res.error)}</span>` : "");
  const fs = res.findings || [];
  $("f-count").textContent = `검사 항목 ${fs.length}건`;
  const counts = fs.reduce((m, f) => (m[f.check] = (m[f.check] || 0) + 1, m), {});
  $("filters").innerHTML = [["all", `전체 ${fs.length}`], ...Object.entries(counts).map(([k, n]) => [k, `${CHECK[k] || k} ${n}`])]
    .map(([k, t]) => `<button data-k="${k}" class="${k === FILTER ? "on" : ""}">${esc(t)}</button>`).join("");
  renderFindings();
  const rv = res.review || {tools: [], removed: [], egress: {now: [], added: [], removed: []}};
  $("tools").innerHTML = rv.tools.map(t => `<tr><td class="mono nw"><b>${esc(t.name)}</b></td>
    <td>${esc(t.description)}${t.previous_description != null && t.previous_description !== t.description ? `<div class="dim">이전: ${esc(t.previous_description)}</div>` : ""}</td>
    <td class="nw">${t.flags.map(f => `<span class="chip ${/삭제|쓰기|바뀜/.test(f) ? "no" : "gray"}">${esc(f)}</span>`).join(" ")}</td></tr>`).join("")
    + rv.removed.map(n => `<tr><td class="mono">${esc(n)}</td><td class="dim">지난 승인본에 있던 툴</td><td><span class="chip gray">빠짐</span></td></tr>`).join("")
    || '<tr><td colspan="3" class="dim">없음</td></tr>';
  const sb = res.sandbox || {};
  $("egress").innerHTML = [...(sb.egress_install || []).map(a => ["설치", a]), ...(sb.egress_runtime || []).map(a => ["실행", a])]
    .map(([s, a]) => `<tr><td>${s}</td><td><span class="chip ${a.result.includes("DENIED") ? "no" : "ok"}">${a.result.includes("DENIED") ? "차단" : "허용"}</span></td><td class="mono">${esc(a.method)} ${esc(a.target)}</td></tr>`).join("")
    || '<tr><td colspan="3" class="dim">없음</td></tr>';
  $("steps").innerHTML = (res.steps || []).map(s => `<tr><td>${esc(s.name)}</td><td><span class="chip ${s.ok ? "ok" : "no"}">${s.ok ? "완료" : "실패"}</span> ${esc(s.error || "")}</td><td class="dim">${s.sec}s</td></tr>`).join("");

  if (window.KIT_ME?.is_admin && r.status === "done") {
    $("admin-card").hidden = false;
    const warns = [];
    const pick = f => rv.tools.filter(t => t.flags.some(x => x.includes(f))).map(t => t.name);
    for (const [label, key] of [["삭제·파괴 툴", "삭제"], ["쓰기 가능 툴", "쓰기"], ["새 툴", "새 툴"], ["설명이 바뀐 툴", "바뀜"]]) {
      const names = pick(key); if (names.length) warns.push(`<div class="warn"><b>${label}</b> ${names.map(esc).join(", ")}</div>`);
    }
    if (rv.egress.added.length || rv.egress.removed.length)
      warns.push(`<div class="warn"><b>외부 접속(egress) 변경</b> 추가 ${rv.egress.added.map(esc).join(", ") || "-"} · 삭제 ${rv.egress.removed.map(esc).join(", ") || "-"}</div>`);
    if ((sb.egress_runtime || []).length) warns.push(`<div class="warn"><b>실행 중 바깥 접속 시도</b> ${(sb.egress_runtime).map(a => esc(a.target)).join(", ")}</div>`);
    $("warns").innerHTML = warns.join("") || '<p class="dim">확인할 변경 없음</p>';
    const blocked = ["차단", "오류"].includes(res.effective_verdict || res.verdict);
    $("decision").innerHTML = r.decision !== "pending" ? `<p>${DEC[r.decision]} · ${esc(r.decided_by)} · ${when(r.decided_at)}</p>` : `
      <textarea id="reason" placeholder="반려 사유 (승인은 비워도 됨)"></textarea>
      <p><button class="btn" id="approve" ${blocked ? "disabled title='막는 항목이 남아 있습니다 — 소명이 모두 허용되면 승인할 수 있습니다'" : ""}>승인</button>${blocked ? ' <span class="dim">막는 항목이 남아 있어 승인할 수 없습니다</span>' : ""}
         <button class="btn red" id="reject">반려</button> <span class="err" id="d-err"></span></p>`;
    const go = action => async () => {
      try { REQ = await api(`/api/requests/${RID}/decision`, {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({action, reason: $("reason").value})}); render(); }
      catch (e) { $("d-err").textContent = e.message; }
    };
    if ($("approve")) { $("approve").onclick = go("approve"); $("reject").onclick = go("reject"); }
  }
}

$("findings").onclick = async ev => {
  const ap = ev.target.closest("[data-ap]"), ad = ev.target.closest("[data-ad]");
  try {
    if (ap) await api(`/api/requests/${RID}/findings/${ap.dataset.ap}/appeal`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: $("ap" + ap.dataset.ap).value})});
    else if (ad) await api(`/api/requests/${RID}/findings/${ad.dataset.ad}/appeal/decision`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({accept: ad.dataset.ok === "1", note: $("an" + ad.dataset.ad).value})});
    else return;
    REQ = await api(`/api/requests/${RID}`); render();
  } catch (e) { alertBox(e.message); }
};
function alertBox(msg) { const d = document.createElement("div"); d.className = "err"; d.textContent = msg; $("findings").prepend(d); }

$("filters").onclick = ev => { const b = ev.target.closest("[data-k]"); if (b) { FILTER = b.dataset.k; render(); } };
async function load() {
  REQ = await api(`/api/requests/${RID}`); render();
  if (REQ.status !== "done") setTimeout(load, 3000);
}
document.addEventListener("kit-me", load);
</script>
<script src="/static/nav.js"></script>
</body>
</html>
